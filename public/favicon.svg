<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Black rounded tile -->
  <rect width="64" height="64" rx="12" fill="#09090b"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="22" stroke="#ffffff" stroke-width="1.6"/>
  <!-- Inner soft ring -->
  <circle cx="32" cy="32" r="18.5" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>

  <!-- Trunk -->
  <path
    d="M32 14.5 V49.5"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Crown branches -->
  <path d="M32 20 C28 20 24.5 17.5 22 15.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 20 C36 20 39.5 17.5 42 15.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 24.5 C26.5 24.5 22 22 18.5 19.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 24.5 C37.5 24.5 42 22 45.5 19.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 29 C25.5 29 20.5 27 17 24.5" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M32 29 C38.5 29 43.5 27 47 24.5" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round"/>

  <!-- Side canopy arcs -->
  <path d="M22 15.5 C20.5 19 20 23 21.5 27" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>
  <path d="M42 15.5 C43.5 19 44 23 42.5 27" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>

  <!-- Roots (mirror of crown) -->
  <path d="M32 44 C28 44 24.5 46.5 22 48.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 44 C36 44 39.5 46.5 42 48.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 39.5 C26.5 39.5 22 42 18.5 44.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 39.5 C37.5 39.5 42 42 45.5 44.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 35 C25.5 35 20.5 37 17 39.5" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M32 35 C38.5 35 43.5 37 47 39.5" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round"/>

  <!-- Root side arcs -->
  <path d="M22 48.5 C20.5 45 20 41 21.5 37" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>
  <path d="M42 48.5 C43.5 45 44 41 42.5 37" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>

  <!-- Center node -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff"/>
</svg>
